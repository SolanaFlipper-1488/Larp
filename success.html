<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Заявка принята</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="success.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="index.html">
          <svg
            class="logo-icon"
            width="28"
            height="28"
            viewbox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M2 20 L9 7 L14 13 L17 3 L22 20 Z" fill="currentColor" />
          </svg>
          <span>Региональные маршруты</span>
        </a>
        <nav aria-label="Главное меню">
          <ul class="nav-list">
            <li><a href="index.html">Главная</a></li>
            <li><a href="catalog.html">Маршруты</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="success-section">
        <div class="success-header">
          <div class="success-icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <h2>Заявка принята!</h2>
        </div>

        <div class="success-content">
          <div class="success-badges">
            <div class="badge">
              <span class="badge-label">Номер заявки</span>
              <span class="badge-value" id="orderNumber">Загрузка...</span>
            </div>
            <div class="badge">
              <span class="badge-label">Статус</span>
              <span class="badge-value">На рассмотрении</span>
            </div>
          </div>

          <div class="success-details">
            <div class="detail-row">
              <span class="detail-label">Маршрут:</span>
              <span class="detail-value">“Горное озеро”</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Дата:</span>
              <span class="detail-value">15-18 июля</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Стоимость:</span>
              <span class="detail-value">15 000 р</span>
            </div>
            <hr class="detail-divider" />
            <p class="manager-text">
              Менеджер свяжется с вами<br />в течении 24 часов
            </p>
          </div>

          <a
            href="index.html"
            class="submit-btn"
            style="
              text-decoration: none;
              display: block;
              text-align: center;
              margin-top: 0;
              background-color: #7f9bc4;
            "
          >
            На главную
          </a>

          <a
            href="catalog.html"
            class="submit-btn"
            style="
              text-decoration: none;
              display: block;
              text-align: center;
              margin-top: 12px;
            "
          >
            К списку маршрутов
          </a>
        </div>
      </div>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <p>&copy; 2026 Региональные маршруты. Учебный проект.</p>
      </div>
    </footer>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get("id");
      const title = urlParams.get("title");
      const price = urlParams.get("price");
      const date = urlParams.get("date");

      if (orderId) document.getElementById("orderNumber").textContent = orderId;
      if (title)
        document.querySelector(
          ".detail-row:nth-child(1) .detail-value",
        ).textContent = `“${title}”`;
      if (date)
        document.querySelector(
          ".detail-row:nth-child(2) .detail-value",
        ).textContent = date;
      if (price)
        document.querySelector(
          ".detail-row:nth-child(3) .detail-value",
        ).textContent = price;
    </script>
  </body>
</html>
